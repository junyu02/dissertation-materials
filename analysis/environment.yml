# conda env for the Follow-Ratio analysis pipeline (B2).
# Reproduce:  conda env create -n stats -f environment.yml
# Pinned to the four packages the pipeline actually loads; conda-forge resolves
# their compatible dependencies (Matrix, minqa, nloptr, Rcpp) automatically.
# lme4 1.1.37 is Matrix-version sensitive -- if resolution ever drifts, the env
# this was frozen from had r-matrix 1.6_5 (see README "Environment").
name: stats
channels:
  - conda-forge
dependencies:
  - r-base=4.3.3
  - r-lme4=1.1_37
  - r-logistf=1.26.1
  - r-data.table=1.17.8
